# CPython 3.12 packages for CI drill runs and zqverify (docs/PLAN.md 4.2, conflict 19).
# The scientific set and pytest follow Pyodide 314.0.7's own lock, so CI grades against the
# versions the web app loads; hypothesis is not in Pyodide's distribution and takes its latest
# release that supports 3.12. Every pin is exact; uv.lock pins the transitive set.
# .python-version pins CPython 3.12.15, the newest 3.12 patch in the download metadata of uv 0.12.23, the latest
# uv on PyPI (uploaded 3 October 2026) [measured]; CI installs it through python-version-file.
[project]
name = "zq-tools"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.2",
  "scipy==1.18.0",
  "statsmodels==0.14.6",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
  "sympy==1.14.0",
  "pytest==9.0.2",
  "hypothesis==6.168.5",
]

[dependency-groups]
dev = ["pip-audit==2.10.1"]

[tool.uv]
package = false
required-version = "==0.8.17"
