# Found by `uv run --project tools/py pytest tools/zqverify` from the repository root, so this directory
# is pytest's rootdir. tools/zqverify has an __init__.py and tools/ has none, so pytest puts tools/ on
# sys.path and tests import the twins as `zqverify.<name>`. Strict: an unknown marker or option, an
# unexpected pass of an xfail and every warning fail the run.
[pytest]
addopts = --strict-markers --strict-config
xfail_strict = true
filterwarnings = error
