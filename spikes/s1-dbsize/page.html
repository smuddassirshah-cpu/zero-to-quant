<title>S1 Database Size Probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&amp;family=Source+Code+Pro:wght@400;600&amp;display=swap">
<style>
/* Spike S1 database size probe, for a phone about 390 px wide. Every colour is a token on :root; the dark set
   is repeated for the media query and for data-theme="dark". The state pill differs by word and border as
   well as by colour. */
:root {
  color-scheme: light;
  --bg: #eceee9;
  --surface: #ffffff;
  --surface-2: #e2e5df;
  --ink: #15191c;
  --ink-muted: #4b545a;
  --line: #c3c8c0;
  --line-strong: #5d666c;
  --accent: #0a58a8;
  --accent-ink: #ffffff;
  --focus: #0a58a8;
  --ok: #2c9c55;
  --ok-ink: #000000;
  --warn: #f0b429;
  --warn-ink: #000000;
  --bad: #c4282c;
  --bad-ink: #ffffff;
  --notice-bg: #fff4d6;
  --notice-ink: #3d2c00;
  --notice-line: #a67c0c;
  --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1012;
    --surface: #161a1d;
    --surface-2: #20262a;
    --ink: #e6e9eb;
    --ink-muted: #a2abb2;
    --line: #30373c;
    --line-strong: #7d878e;
    --accent: #6db3ff;
    --accent-ink: #000000;
    --focus: #8fc5ff;
    --ok: #43c174;
    --ok-ink: #000000;
    --warn: #ffcc55;
    --warn-ink: #000000;
    --bad: #ff7070;
    --bad-ink: #000000;
    --notice-bg: #2e2508;
    --notice-ink: #ffe7a6;
    --notice-line: #b38d24;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1012;
  --surface: #161a1d;
  --surface-2: #20262a;
  --ink: #e6e9eb;
  --ink-muted: #a2abb2;
  --line: #30373c;
  --line-strong: #7d878e;
  --accent: #6db3ff;
  --accent-ink: #000000;
  --focus: #8fc5ff;
  --ok: #43c174;
  --ok-ink: #000000;
  --warn: #ffcc55;
  --warn-ink: #000000;
  --bad: #ff7070;
  --bad-ink: #000000;
  --notice-bg: #2e2508;
  --notice-ink: #ffe7a6;
  --notice-line: #b38d24;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--sans); }
[hidden] { display: none !important; }
#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  overflow-wrap: anywhere;
}
.boot-line { color: var(--ink-muted); }
h1 { margin: 4px 0 6px; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.lede { font-size: 15px; color: var(--ink-muted); }
.notice {
  margin: 12px 0 0;
  padding: 10px 12px;
  border-left: 6px solid var(--notice-line);
  border-radius: 6px;
  background: var(--notice-bg);
  color: var(--notice-ink);
  font-size: 15px;
}
.test-note { margin: 8px 0 0; font: 600 13px/1.4 var(--mono); color: var(--bad); }
.panel {
  margin: 12px 0 0;
  padding: 12px 14px;
  border: 2px solid var(--line-strong);
  border-radius: 10px;
  background: var(--surface);
}
.state-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.state-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.pill {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 2px 10px;
  border: 2px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: 600 13px/1.2 var(--mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill[data-state="running"], .pill[data-state="cleaning"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.pill[data-state="done"], .pill[data-state="clean"] { border-color: var(--ok); background: var(--ok); color: var(--ok-ink); }
.pill[data-state="capped"] { border: 2px dashed var(--warn-ink); background: var(--warn); color: var(--warn-ink); }
.pill[data-state="error"] { border-color: var(--bad); border-radius: 2px; background: var(--bad); color: var(--bad-ink); }
.pill[data-state="paused"], .pill[data-state="interrupted"] { border-style: dashed; }
.bar {
  height: 14px;
  margin: 12px 0 6px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--surface-2);
}
.fill { width: 0; height: 100%; background: var(--accent); }
.progress-text { font-size: 15px; font-weight: 600; }
.facts { display: grid; gap: 6px; margin: 12px 0 0; }
.facts div { display: grid; grid-template-columns: minmax(7.5em, 34%) 1fr; gap: 8px; align-items: baseline; }
.facts dt { font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.facts dd { margin: 0; font: 400 14px/1.4 var(--mono); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.btn {
  min-height: 44px;
  padding: 10px 16px;
  border: 2px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font: 600 15px/1.2 var(--sans);
  cursor: pointer;
  touch-action: manipulation;
}
.btn:active { background: var(--surface-2); }
.btn:disabled { border-style: dashed; color: var(--ink-muted); cursor: default; }
.btn-primary:enabled { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.message { margin: 10px 0 0; font-size: 14px; }
.message:empty { display: none; }
details.saved { margin: 12px 0 0; }
details.saved > summary { padding: 8px 0; font-size: 14px; font-weight: 600; color: var(--ink-muted); cursor: pointer; }
.saved-at { font-size: 13px; color: var(--ink-muted); }
.json {
  max-height: 24rem;
  margin: 6px 0 0;
  padding: 8px;
  overflow: auto;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink);
  font: 400 12px/1.4 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
<div id="app"><p class="boot-line">The database size probe is loading. If this line is still here after a minute, the page's scripts did not run: tell Claude.</p></div>
<script>
(function () {
  import('./dbsize.js').catch(function (e) {
    var app = document.getElementById('app');
    if (app) app.textContent = 'The database size probe could not start: ' + String(e);
    console.error('The database size probe could not start:', e);
  });
})();
</script>
