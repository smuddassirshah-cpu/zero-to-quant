# Local gates (docs/PLAN.md 7.1, 7.6), installed by `npm install` through the prepare script.
# Fail closed [measured, 7 October 2026]: without assert_lefthook_installed, lefthook's hook script lets a
# commit through when it cannot find lefthook. And a hook type new to this file is installed only by the next
# `lefthook install` or by the sync lefthook runs in prepare-commit-msg, after pre-commit; a scratch repository
# reproduced the observed commit that passed with no secret scan this way. CI repeats every gate.
assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,css,html,yml,yaml}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: npx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    css:
      glob: '*.css'
      run: npx stylelint {staged_files}
    secrets:
      run: node tools/ci/gitleaks.ts staged

pre-push:
  commands:
    secrets:
      run: node tools/ci/gitleaks.ts history
    check:
      run: npm run check
    unit:
      run: npm test
    audit:
      run: npm run check:audit
    pip-audit:
      run: node tools/ci/pip-audit.ts
