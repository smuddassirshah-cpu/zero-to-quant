name: zq-playwright
description: Playwright 1.63.0 with Chromium (browser cached). Called by zq-setup, and on its own by the play and extras jobs, which install it only when the green-hash cache says something changed. The pin appears here, in the cache key below and in zq-setup (ZQ_PLAYWRIGHT_VERSION), three places to keep in step.
runs:
  using: composite
  steps:
    - name: Playwright browser cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-1.63.0-chromium-shell-${{ runner.os }}

    # There is no package.json: the tools do import('playwright'), which resolves from the workspace root.
    - name: Install Playwright 1.63.0 and Chromium
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -o pipefail
        npm i --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0 2>&1 | tail -5
        npx playwright install --with-deps --only-shell chromium 2>&1 | tail -5
        # tools run from a temp copy of app/ cannot resolve the workspace node_modules; the loaders fall back to NODE_PATH
        echo "NODE_PATH=${{ github.workspace }}/node_modules" >> "$GITHUB_ENV"
