name: zq-setup
description: Node 22, and on request Playwright 1.63.0 with Chromium (cached), Python 3.12 with the test packages (pip cached), and a lean local CDN (Compute Engine and MathLive only).
inputs:
  playwright:
    description: "true to install Playwright and Chromium"
    default: "false"
  python:
    description: "true to install Python 3.12 and requirements.txt"
    default: "false"
  cdn:
    description: "true to fetch the Compute Engine and MathLive into $ZQ_CDN_LEAN (for the node tests that take --local-cdn)"
    default: "false"
runs:
  using: composite
  steps:
    - name: Start the wall clock
      shell: bash
      run: echo "ZQ_T0=$(date +%s)" >> "$GITHUB_ENV"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    # The Playwright version is part of the green-hash engine hash (tools/green-cache.mjs). The installed package is what is hashed; this pin stands in
    # before the install, so the play and extras jobs can select changed items without a browser. Keep it equal to the pin in zq-playwright.
    - name: Pin for the green-hash engine hash
      shell: bash
      run: echo "ZQ_PLAYWRIGHT_VERSION=1.63.0" >> "$GITHUB_ENV"

    - name: Playwright and Chromium
      if: inputs.playwright == 'true'
      uses: ./.github/actions/zq-playwright

    - uses: actions/setup-python@v5
      if: inputs.python == 'true'
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: .github/actions/zq-setup/requirements.txt

    - name: Install the Python test packages
      if: inputs.python == 'true'
      shell: bash
      run: |
        set -o pipefail
        pip install -r .github/actions/zq-setup/requirements.txt 2>&1 | tail -3

    # The npm tarballs unpack to package/, the layout tools/fetch-local-cdn.sh builds (and --local-cdn expects).
    - name: Lean local CDN (Compute Engine 0.30.2, MathLive 0.105.0)
      if: inputs.cdn == 'true'
      shell: bash
      run: |
        set -o pipefail
        d="$RUNNER_TEMP/zq-cdn"
        mkdir -p "$d/cortex-js-compute-engine-0.30.2" "$d/mathlive-0.105.0"
        curl -fsSL --retry 3 https://registry.npmjs.org/@cortex-js/compute-engine/-/compute-engine-0.30.2.tgz | tar -xz -C "$d/cortex-js-compute-engine-0.30.2"
        curl -fsSL --retry 3 https://registry.npmjs.org/mathlive/-/mathlive-0.105.0.tgz | tar -xz -C "$d/mathlive-0.105.0"
        test -f "$d/cortex-js-compute-engine-0.30.2/package/dist/compute-engine.min.umd.js"
        echo "ZQ_CDN_LEAN=$d" >> "$GITHUB_ENV"
