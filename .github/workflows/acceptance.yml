name: acceptance

# The session's acceptance suite on real jsDelivr (no --local-cdn for Pyodide, YoWASP or MathLive). What runs, how to read a failure: docs/CI.md.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Playthrough shards per viewport (1 to 64)"
        default: "16"
      suite:
        description: "Which part to run"
        type: choice
        default: full
        options: [full, static, tests, play, extras]
      mode:
        description: "changed: replay only what the green-hash cache says changed. full: replay everything and reseed the cache"
        type: choice
        default: full
        options: [full, changed]
  # Weekly full run, so cache drift cannot hide a fault for long. Sunday 03:17 UTC: no one is pushing, and the odd minute keeps clear of the
  # top-of-hour queue. A scheduled run reads this file from the DEFAULT branch only (main) and runs main's code: it fires only once this
  # workflow is merged there (docs/CI.md). Until then, run the dispatch with mode full by hand.
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches: [claude/amazing-wright-d4mx7i]
    # .github/actions is added to the brief's filter: the shared setup step lives there and a change to it must re-run the suite
    paths: ["app/**", ".github/workflows/**", ".github/actions/**"]

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      n: ${{ steps.p.outputs.n }}
      mode: ${{ steps.p.outputs.mode }}
      shards: ${{ steps.p.outputs.shards }}
      static: ${{ steps.p.outputs.static }}
      tests: ${{ steps.p.outputs.tests }}
      play: ${{ steps.p.outputs.play }}
      extras: ${{ steps.p.outputs.extras }}
    steps:
      - id: p
        working-directory: .
        env:
          SHARDS_IN: ${{ inputs.shards }}
          SUITE_IN: ${{ inputs.suite }}
          MODE_IN: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          n="${SHARDS_IN:-16}"; suite="${SUITE_IN:-full}"
          # a push replays what changed; a dispatch or the weekly schedule replays everything (and reseeds the cache) unless a dispatch asks for changed
          if [ "$EVENT" = push ]; then mode=changed; else mode="${MODE_IN:-full}"; fi
          case "$mode" in changed|full) ;; *) echo "::error::mode must be changed or full, got '$mode'"; exit 1 ;; esac
          case "$n" in ''|*[!0-9]*) echo "::error::shards must be a whole number, got '$n'"; exit 1 ;; esac
          if [ "$n" -lt 1 ] || [ "$n" -gt 64 ]; then echo "::error::shards must be 1 to 64, got $n"; exit 1; fi
          on() { case "$suite" in full|"$1") echo true ;; *) echo false ;; esac; }
          { echo "n=$n"; echo "mode=$mode"; echo "shards=[$(seq -s, 1 "$n")]"
            echo "static=$(on static)"; echo "tests=$(on tests)"; echo "play=$(on play)"; echo "extras=$(on extras)"; } >> "$GITHUB_OUTPUT"
          echo "suite $suite, $n shards, mode $mode" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # Validator, readiness sums, the test-file coverage check, grade-all, and every test that needs no browser.
  static:
    name: static
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      secs: ${{ steps.clock.outputs.secs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zq-setup
        with: { cdn: "true" }
      - name: Validator (0 errors)
        run: node tools/validate.mjs 2>&1 | tail -40
      - name: Same-course reuse (no unwaived error in any problem set)
        run: node tools/same-course-reuse.mjs --all 2>&1 | tail -40
      - name: Readiness sums
        run: node tools/readiness-sums.mjs 2>&1 | tail -40
      - name: Every tools/test-* file is run by exactly one job
        run: node tools/ci-coverage.mjs 2>&1 | tail -40
      - name: grade-all (keys, bands and slip routing, no browser)
        run: node tools/grade-all.mjs --local-cdn "$ZQ_CDN_LEAN" 2>&1 | tail -40
      - name: Tests that need no browser
        run: |
          bash tools/ci-run.sh <<'EOF'
          node tools/test-capstone.mjs
          node tools/test-ci-cache-keys.mjs
          node tools/test-cumulative.mjs
          node tools/test-drill-constraints.mjs
          node tools/test-exam-minutes.mjs
          node tools/test-expr-equations.mjs --local-cdn "$ZQ_CDN_LEAN"
          node tools/test-fluency-reach.mjs
          node tools/test-fresh-check.mjs
          node tools/test-grade-ab3.mjs --local-cdn "$ZQ_CDN_LEAN"
          node tools/test-grade-all.mjs --local-cdn "$ZQ_CDN_LEAN"
          node tools/test-hours-split.mjs
          node tools/test-lint-dup-keys.mjs
          bash tools/test-merge-wave.sh
          node tools/test-met-rule.mjs
          python3 tools/test-numbers-lib.py
          node tools/test-perf-reports.mjs
          node tools/test-rubric-passes.mjs
          EOF
      - id: clock
        if: always()
        run: |
          s=$(( $(date +%s) - ZQ_T0 )); echo "secs=$s" >> "$GITHUB_OUTPUT"
          echo "static: wall clock ${s} s" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # Every test that needs Chromium or Pyodide. Three legs so the longest (test-fluency) does not hold the rest. The grading leg gets the lean
  # local CDN (Compute Engine and MathLive) because its unit parts need the Compute Engine as a file; the other legs use the real CDN.
  tests-browser:
    name: tests-browser (${{ matrix.leg }})
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [grading, ui, python]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            .github
      - uses: ./.github/actions/zq-setup
        with:
          playwright: "true"
          cdn: ${{ matrix.leg == 'grading' && 'true' || 'false' }}
          python: ${{ matrix.leg == 'python' && 'true' || 'false' }}
      - name: Grading tests (real widgets in Chromium, desktop and mobile)
        if: matrix.leg == 'grading'
        run: |
          bash tools/ci-run.sh <<'EOF'
          node tools/test-answer-forms.mjs --local-cdn "$ZQ_CDN_LEAN"
          node tools/test-engine-runtime.mjs --local-cdn "$ZQ_CDN_LEAN"
          node tools/test-engine-runtime.mjs --local-cdn "$ZQ_CDN_LEAN" --mobile
          node tools/test-problems.mjs --local-cdn "$ZQ_CDN_LEAN"
          node tools/test-fluency.mjs --local-cdn "$ZQ_CDN_LEAN"
          EOF
      - name: Interface tests (desktop and mobile)
        if: matrix.leg == 'ui'
        run: |
          bash tools/ci-run.sh <<'EOF'
          node tools/test-check-first.mjs
          node tools/test-check-first.mjs --mobile
          node tools/test-today-tested-out.mjs
          node tools/test-today-tested-out.mjs --mobile
          node tools/test-playthrough-overflow.mjs
          node tools/test-playthrough-tall.mjs
          node tools/test-playthrough-changed.mjs
          EOF
      - name: Python and C++ tests (Pyodide and YoWASP from jsDelivr)
        if: matrix.leg == 'python'
        run: |
          bash tools/ci-run.sh <<'EOF'
          node tools/test-bank-code.mjs
          node tools/test-drill-page.mjs
          node tools/test-drill-recursion.mjs
          node tools/test-planted-check.mjs
          EOF
      - id: clock
        if: always()
        run: |
          echo "tests-browser (${{ matrix.leg }}): wall clock $(( $(date +%s) - ZQ_T0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # The test-validate-* files, each called by name with no flags (another change is making them fast). Only the band-rules test is given the
  # Compute Engine through the environment, so its value comparison runs instead of being skipped.
  validate-tests:
    name: validate-tests
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      secs: ${{ steps.clock.outputs.secs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zq-setup
        with: { cdn: "true" }
      - name: test-validate-*
        run: |
          bash tools/ci-run.sh <<'EOF'
          node tools/test-validate-answer-forms.mjs
          ZQ_LOCAL_CDN="$ZQ_CDN_LEAN" node tools/test-validate-band-rules.mjs
          node tools/test-validate-capstone.mjs
          node tools/test-validate-drill-index.mjs
          node tools/test-validate-fluency.mjs
          node tools/test-validate-near-miss.mjs
          node tools/test-validate-o2.mjs
          node tools/test-validate-perf.mjs
          node tools/test-validate-problems.mjs
          node tools/test-validate-review-pass.mjs
          node tools/test-validate-session-v-b.mjs
          node tools/test-validate-session.mjs
          node tools/test-validate-shown-arithmetic.mjs
          node tools/test-validate-shuffled-position.mjs
          node tools/test-validate-table-slip-key.mjs
          node tools/test-validate-table-wrong.mjs
          node tools/test-validate-harness.mjs
          node tools/test-validate-versions.mjs
          node tools/test-validate-why.mjs
          node tools/test-validate-wrong-fire.mjs
          EOF
      - id: clock
        if: always()
        run: |
          s=$(( $(date +%s) - ZQ_T0 )); echo "secs=$s" >> "$GITHUB_OUTPUT"
          echo "validate-tests: wall clock ${s} s" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # playthrough --all in N shards, desktop and --mobile. The routes run in the extras job (--routes-only), so --no-routes here keeps shard 1 even.
  play:
    name: play ${{ matrix.shard }} ${{ matrix.vp }}
    needs: plan
    if: needs.plan.outputs.play == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        vp: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            .github
      - uses: ./.github/actions/zq-setup
      # The green-hash cache (docs/CI.md, "The green-hash cache"): this job's own file, restored from the newest cache under its prefix (the prefix ends
      # in "-", so shard 1 never matches shard 10). A full run restores nothing: it replays everything and saves a fresh file. The cache is saved under a
      # key unique to this attempt (caches are immutable), only when the job was not cancelled and recorded something new.
      - name: Restore the green cache
        if: needs.plan.outputs.mode == 'changed'
        uses: actions/cache/restore@v4
        with:
          path: app/tools/.green-cache.json
          key: green-play-${{ needs.plan.outputs.n }}-${{ matrix.vp }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: green-play-${{ needs.plan.outputs.n }}-${{ matrix.vp }}-${{ matrix.shard }}-
      - name: Select the changed items (no browser)
        id: sel
        env:
          SHARD: ${{ matrix.shard }}
          N: ${{ needs.plan.outputs.n }}
          VP: ${{ matrix.vp }}
        run: |
          set -o pipefail
          flag=""; [ "$VP" = mobile ] && flag="--mobile"
          args="--all --shard $SHARD/$N --no-routes $flag"
          echo "PT_ARGS=$args" >> "$GITHUB_ENV"
          PT_ARGS="$args" bash tools/ci-green.sh select "play $SHARD $VP"
      - name: Install Playwright (only when something changed)
        if: steps.sel.outputs.k != '0'
        uses: ./.github/actions/zq-playwright
      - name: playthrough --all --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n }} (${{ matrix.vp }}, ${{ needs.plan.outputs.mode }}, ${{ steps.sel.outputs.k }} of ${{ steps.sel.outputs.n }})
        if: steps.sel.outputs.k != '0'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -o pipefail
          chg=""; [ "$MODE" = changed ] && chg="--changed"
          node tools/playthrough.mjs $PT_ARGS $chg --cache tools/.green-cache.json 2>&1 | tee "$RUNNER_TEMP/play.log" | tail -40
      - name: Failing lines
        if: failure()
        run: grep -E '^(FAIL|PLANTED-FAIL)' "$RUNNER_TEMP/play.log" | head -40 || true
      - name: Did the cache grow
        id: fin
        if: ${{ !cancelled() && steps.sel.outputs.k != '0' }}
        env:
          BEFORE: ${{ steps.sel.outputs.before }}
        run: bash tools/ci-green.sh dirty "$BEFORE"
      - name: Save the green cache
        if: ${{ !cancelled() && steps.fin.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/tools/.green-cache.json
          key: green-play-${{ needs.plan.outputs.n }}-${{ matrix.vp }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record changed K of N
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: changed-play-${{ matrix.vp }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/changed.txt
          retention-days: 1
          if-no-files-found: ignore
      - id: clock
        if: always()
        run: |
          echo "play ${{ matrix.shard }} ${{ matrix.vp }}: wall clock $(( $(date +%s) - ZQ_T0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # The other playthrough modes. --problems all and --fluency-all honour --shard (their items are in the sharded item list), so they are split.
  # --drills does not: it plays every drill file and then the session, in one process. It is split here by naming the drills (--drill <id>, repeated),
  # and the session play (--session) runs in drills-1 only.
  extras:
    name: extras ${{ matrix.part }} ${{ matrix.vp }}
    needs: plan
    if: needs.plan.outputs.extras == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        vp: [desktop, mobile]
        part: [problems-1, problems-2, fluency-1, fluency-2, fluency-3, fluency-4, drills-1, drills-2, drills-3, routes-1]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            .github
      - uses: ./.github/actions/zq-setup
      # The green-hash cache: the same scheme as the play job (this job's own file, newest under its prefix, saved under a key unique to the attempt).
      - name: Restore the green cache
        if: needs.plan.outputs.mode == 'changed'
        uses: actions/cache/restore@v4
        with:
          path: app/tools/.green-cache.json
          key: green-extras-${{ matrix.vp }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: green-extras-${{ matrix.vp }}-${{ matrix.part }}-
      - name: Select the changed items (no browser)
        id: sel
        env:
          PART: ${{ matrix.part }}
          VP: ${{ matrix.vp }}
        run: |
          set -o pipefail
          kind="${PART%-*}"; i="${PART##*-}"
          flag=""; [ "$VP" = mobile ] && flag="--mobile"
          case "$kind" in
            problems) args="--problems all --shard $i/2" ;;
            fluency)  args="--fluency-all --shard $i/4" ;;
            routes)   args="--routes-only" ;;
            drills)
              ids=$(ls content/drills | grep '\.json$' | grep -v '^index\.json$' | sed 's/\.json$//' | sort | awk -v i="$i" '(NR-1) % 3 == i-1')
              args=$(for d in $ids; do printf -- '--drill %s ' "$d"; done)
              [ "$i" = 1 ] && args="$args--session"
              echo "drills in this part: $(echo "$ids" | wc -l)" ;;
          esac
          echo "PT_ARGS=$args $flag" >> "$GITHUB_ENV"
          PT_ARGS="$args $flag" bash tools/ci-green.sh select "extras $PART $VP"
      - name: Install Playwright (only when something changed)
        if: steps.sel.outputs.k != '0'
        uses: ./.github/actions/zq-playwright
      - name: playthrough ${{ matrix.part }} (${{ matrix.vp }}, ${{ needs.plan.outputs.mode }}, ${{ steps.sel.outputs.k }} of ${{ steps.sel.outputs.n }})
        if: steps.sel.outputs.k != '0'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -o pipefail
          chg=""; [ "$MODE" = changed ] && chg="--changed"
          # word splitting of $PT_ARGS is intended: it is a list of flags
          node tools/playthrough.mjs $PT_ARGS $chg --cache tools/.green-cache.json 2>&1 | tee "$RUNNER_TEMP/extras.log" | tail -40
      - name: Failing lines
        if: failure()
        run: grep -E '^(FAIL|PLANTED-FAIL)' "$RUNNER_TEMP/extras.log" | head -40 || true
      - name: Did the cache grow
        id: fin
        if: ${{ !cancelled() && steps.sel.outputs.k != '0' }}
        env:
          BEFORE: ${{ steps.sel.outputs.before }}
        run: bash tools/ci-green.sh dirty "$BEFORE"
      - name: Save the green cache
        if: ${{ !cancelled() && steps.fin.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/tools/.green-cache.json
          key: green-extras-${{ matrix.vp }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record changed K of N
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: changed-extras-${{ matrix.vp }}-${{ matrix.part }}
          path: ${{ runner.temp }}/changed.txt
          retention-days: 1
          if-no-files-found: ignore
      - id: clock
        if: always()
        run: |
          echo "extras ${{ matrix.part }} ${{ matrix.vp }}: wall clock $(( $(date +%s) - ZQ_T0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # Every number script (docs/CI.md): the Python files that recompute each stated figure, key and slip. Runs in full on every push and dispatch.
  # Red on a new failure, and on a script of tools/number-scripts-known-failing.txt that starts to pass.
  number-scripts:
    name: number-scripts
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      secs: ${{ steps.clock.outputs.secs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zq-setup
        with: { python: "true" }
      - name: Runner test
        run: node tools/test-run-number-scripts.mjs 2>&1 | tail -20
      - name: Every number script
        run: node tools/run-number-scripts.mjs --timeout 300 2>&1 | tail -80
      - id: clock
        if: always()
        run: |
          s=$(( $(date +%s) - ZQ_T0 )); echo "secs=$s" >> "$GITHUB_OUTPUT"
          echo "number-scripts: wall clock ${s} s" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # One status to read: green only if every job that was asked for succeeded (a job left out by the `suite` input shows as skipped).
  acceptance:
    name: acceptance
    if: always()
    needs: [plan, static, tests-browser, validate-tests, play, extras, number-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      # each play and extras job uploads one line, "<job>: changed K of N" (a cancelled job uploads none)
      - name: Fetch the changed K of N lines
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: changed-*
          merge-multiple: true
          path: ${{ runner.temp }}/changed
      - name: Summary and verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          MODE: ${{ needs.plan.outputs.mode }}
          EVENT: ${{ github.event_name }}
          CH: ${{ runner.temp }}/changed
        run: |
          set -o pipefail
          {
            echo "### acceptance"
            echo
            echo "mode: **${MODE:-unknown}** (${EVENT}). changed: replays only what the green-hash cache could not vouch for; full: replays everything and reseeds the cache."
            echo
            if ls "$CH"/*.txt > /dev/null 2>&1; then
              echo '```'
              cat "$CH"/*.txt | sort -V
              cat "$CH"/*.txt | awk '{ k += $(NF-2); n += $NF } END { printf "total: changed %d of %d across %d jobs\n", k, n, NR }'
              echo '```'
              echo
            fi
            echo "| job | result | wall clock |"
            echo "| --- | --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) | \(if .value.outputs.secs then (.value.outputs.secs + " s") else "see the legs" end) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' | paste -sd, -)
          if [ -n "$bad" ]; then echo "::error::not green: $bad"; exit 1; fi
          echo "all green"
