# Pull-request gates (docs/ARCHITECTURE.md 8.3). Stage 1 owns static, unit, build and the secrets scan; later
# stages add widgets, content, e2e sharding, visual and perf. First-party actions only, each by major tag until
# it is pinned to a commit SHA (STATE.md open question 25). `npm ci --ignore-scripts` everywhere: no dependency
# install script runs in CI (only lefthook's and the macOS-only fsevents' exist), and no git hooks are installed.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'stage/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Types, lint, format, CSS, knip, env names, licences
        run: npm run check
      - uses: actions/setup-python@v6 # pin to a commit SHA (STATE.md open question 25)
        with:
          python-version-file: tools/py/.python-version
      - name: Install uv 0.8.17 by hash
        run: |
          python -m pip install --require-hashes --only-binary :all: -r tools/py/uv-bootstrap.txt
      - name: The Python lock is current and reproduces
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          npm run check:py
          git diff --exit-code -- tools/py/uv.lock
      - name: zqverify, the Python twins
        env:
          UV_PYTHON_DOWNLOADS: never
        run: npm run test:py

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Both targets, with the release budgets
        run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Release tools against the real dist/artifact (planted-file budget tests)
        env:
          ZQ_REQUIRE_DIST: '1'
        run: npx vitest run tools/release

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA (STATE.md open question 25)
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v6 # pin to a commit SHA (STATE.md open question 25)
        with:
          # The toolchain `go install` fetched for gitleaks v8.30.1 (go.mod: go 1.24.11) [measured].
          go-version: '1.26.8'
          cache: false
      - run: npm run setup:gitleaks
      - name: Full history of every ref
        run: node tools/ci/gitleaks.ts history
      - name: Planted keys fail both scans, under an empty and a hostile git config
        run: node tools/ci/gitleaks.ts selftest
