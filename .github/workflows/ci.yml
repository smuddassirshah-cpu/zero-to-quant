# Pull-request gates (docs/ARCHITECTURE.md 8.3). Stage 1 owns static, unit, build and the secrets scan; later
# stages add widgets, content, e2e sharding, visual and perf. First-party actions only, by major tag until each
# is pinned to a commit SHA (open item, docs/PLAN.md 7.6).
name: ci

on:
  pull_request:
  push:
    branches: [main, 'stage/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types, lint, format, CSS, knip, env names, licences
        run: npm run check
      - uses: actions/setup-python@v6 # pin to a commit SHA
        with:
          python-version: '3.12'
      - name: Install uv 0.8.17 by hash
        run: |
          python -m pip install --require-hashes --only-binary :all: -r tools/py/uv-bootstrap.txt
      - name: The Python lock is current and reproduces
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          npm run check:py
          git diff --exit-code -- tools/py/uv.lock

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Both targets, with the release budgets
        run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Release tools against the real dist/artifact (planted-file budget tests)
        run: npx vitest run tools/release

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # pin to a commit SHA
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5 # pin to a commit SHA
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v6 # pin to a commit SHA
        with:
          # gitleaks v8.30.1 needs Go 1.24.11 or later; the tool also sets GOTOOLCHAIN=auto as a fallback.
          go-version: '1.24'
          check-latest: true
          cache: false
      - run: npm run setup:gitleaks
      - name: Full history of every ref
        run: node tools/ci/gitleaks.ts history
      - name: A planted fake key fails the scan
        run: node tools/ci/gitleaks.ts selftest
